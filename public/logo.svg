<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="title">
  <title id="title">LUAVAIL Script Hosting</title>
  <defs>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0878ff"/>
      <stop offset=".48" stop-color="#168bff"/>
      <stop offset=".72" stop-color="#dcecff"/>
      <stop offset="1" stop-color="#fff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
