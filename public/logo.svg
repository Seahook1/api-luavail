  <path d="M112 146H244 M516 146H648" stroke="#0878ff" stroke-width="2.5" opacity=".9"/>
  <text x="380" y="153" text-anchor="middle" fill="#168bff" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="9">SCRIPT HOSTING</text>
